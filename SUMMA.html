 <script>
        /* ====== START: Auto-fill from quotation when ?fromQuotation=ID is present ====== */
        (async function populateFromQuotationIfRequested() {
            // helper: get query param
            function getQueryParam(name) {
                const url = new URL(window.location.href);
                return url.searchParams.get(name);
            }

            // helper: try multiple URLs to fetch quotation (makes it resilient to different dev hosts)
            async function fetchQuotationById(qid) {
                const attempts = [
                    `/api/quotations/${encodeURIComponent(qid)}`,
                    `/api/quotation/${encodeURIComponent(qid)}`,
                    `http://Aixains-Mac-mini.local:8000/api/quotations/${encodeURIComponent(qid)}`,
                    `http://Aixains-Mac-mini.local:8000/api/quotations/${encodeURIComponent(qid)}`,
                    `http://localhost:5000/api/quotations/${encodeURIComponent(qid)}`
                ];

                let lastErr = null;
                for (const u of attempts) {
                    try {
                        const res = await fetch(u, { method: 'GET' });
                        if (!res.ok) {
                            lastErr = new Error(`HTTP ${res.status} from ${u}`);
                            continue;
                        }
                        const json = await res.json();
                        // sometimes API returns {quotation: {...}} or array; normalize:
                        if (Array.isArray(json) && json.length) return json[0];
                        if (json && json.quotation) return json.quotation;
                        return json;
                    } catch (e) {
                        lastErr = e;
                        // try next
                    }
                }
                throw lastErr || new Error('Failed to fetch quotation');
            }

            // helper: create item row and fill values (re-uses existing createItemRow logic where possible)
            function addItemRowWithData(item) {
                // if createItemRow() exists on the page, call it; otherwise use internal builder
                if (typeof createItemRow === 'function') {
                    createItemRow();
                    // last appended row is the last .item-row
                    const rows = document.querySelectorAll('.item-row');
                    const row = rows[rows.length - 1];
                    if (!row) return;
                    const nameEl = row.querySelector('.item-name');
                    const qtyEl = row.querySelector('.quantity');
                    const rateEl = row.querySelector('.rate');
                    const descEl = row.querySelector('.description');

                    if (nameEl) nameEl.value = item.item_name ?? item.name ?? item.title ?? '';
                    if (qtyEl) qtyEl.value = (item.quantity ?? item.qty ?? 1);
                    if (rateEl) rateEl.value = (item.rate ?? item.unit_price ?? item.price ?? 0);
                    if (descEl) descEl.value = item.description ?? item.desc ?? '';
                    // trigger update
                    if (typeof updateRowAmount === 'function') {
                        updateRowAmount(row);
                    } else {
                        // fallback: compute amount text
                        const qty = parseFloat(qtyEl?.value || 0);
                        const rate = parseFloat(rateEl?.value || 0);
                        const amt = (row.querySelector('.amount'));
                        if (amt) amt.textContent = `₹${(qty * rate).toFixed(2)}`;
                    }
                } else {
                    // fallback build row (if createItemRow isn't present)
                    const itemsContainer = document.getElementById('items-container');
                    const row = document.createElement('div');
                    row.className = 'item-row space-y-2 p-2 border rounded';
                    row.innerHTML = `
        <div class="grid grid-cols-12 gap-2 items-center">
          <input class="col-span-5 item-name input-field" placeholder="Item name" required>
          <input type="number" class="col-span-2 quantity input-field text-right" value="1" min="1">
          <input type="number" class="col-span-2 rate input-field text-right" value="0" min="0">
          <span class="col-span-3 amount text-right">₹0.00</span>
        </div>
        <textarea class="description input-field col-span-12" rows="2" placeholder="Item description (optional)"></textarea>
      `;
                    itemsContainer.appendChild(row);
                    // fill values:
                    row.querySelector('.item-name').value = item.item_name ?? item.name ?? '';
                    row.querySelector('.quantity').value = item.quantity ?? item.qty ?? 1;
                    row.querySelector('.rate').value = item.rate ?? item.unit_price ?? item.price ?? 0;
                    row.querySelector('.description').value = item.description ?? item.desc ?? '';
                    // compute amount
                    const qty = parseFloat(row.querySelector('.quantity').value || 0);
                    const rate = parseFloat(row.querySelector('.rate').value || 0);
                    row.querySelector('.amount').textContent = `₹${(qty * rate).toFixed(2)}`;
                }
            }

            function setClientField(clientObjOrName) {
                // support both select (#billed-to-select) and textarea/input (#billed-to-input)
                const billedSelect = document.getElementById('billed-to-select');
                const billedInput = document.getElementById('billed-to-input');
                const name = typeof clientObjOrName === 'string' ? clientObjOrName : (clientObjOrName?.client_name || clientObjOrName?.name || '');

                if (billedSelect) {
                    // ensure option exists
                    let opt = Array.from(billedSelect.options).find(o => o.text === name || o.value === (clientObjOrName?._id || ''));
                    if (!opt) {
                        opt = document.createElement('option');
                        opt.value = clientObjOrName?._id ?? name;
                        opt.textContent = name || opt.value;
                        billedSelect.appendChild(opt);
                    }
                    billedSelect.value = opt.value;
                } else if (billedInput) {
                    billedInput.value = name;
                }
            }

            // main flow:
            const qid = getQueryParam('fromQuotation') || getQueryParam('quotationId') || getQueryParam('qid');
            if (!qid) return; // nothing to do

            try {
                // small delay so that other initialization (loadClients, loadCompany) has chance to run if present
                await new Promise(r => setTimeout(r, 250));
                const q = await fetchQuotationById(qid);

                if (!q) throw new Error('Quotation not found');

                // Map common fields (be defensive about possible field names)
                // date
                const soDateEl = document.getElementById('sales-order-date');
                if (soDateEl) {
                    soDateEl.value = q.sales_date || q.date || q.quotation_date || q.created_at || new Date().toISOString().slice(0, 10);
                }

                // company/from block
                if (q.from) {
                    if (document.getElementById('businessName')) document.getElementById('businessName').value = q.from.businessName ?? q.from.business_name ?? q.from.name ?? document.getElementById('businessName').value;
                    if (document.getElementById('city')) document.getElementById('city').value = q.from.city ?? q.from['city/town'] ?? q.from.city_town ?? document.getElementById('city').value;
                    if (document.getElementById('country')) document.getElementById('country').value = q.from.country ?? document.getElementById('country').value;
                } else {
                    // sometimes quotation has company fields at top-level
                    if (document.getElementById('businessName') && (q.companyName || q.business_name)) document.getElementById('businessName').value = q.companyName ?? q.business_name;
                }

                // billed to / client
                if (q.to) {
                    setClientField(q.to);
                } else if (q.client_name || q.client) {
                    setClientField(q.client_name ?? q.client);
                }

                // logo - if quotation includes base64 / url
                if (q.logo || (q.from && q.from.logo)) {
                    const logoUrl = q.logo ?? q.from.logo;
                    const logoPreview = document.getElementById('businessLogoPreview') || document.getElementById('logo-preview') || document.getElementById('logo-preview-img');
                    if (logoPreview) {
                        logoPreview.src = logoUrl;
                    }
                }

                // clear existing items
                const itemsContainer = document.getElementById('items-container');
                if (itemsContainer) itemsContainer.innerHTML = '';

                // items mapping: handle several shapes
                const itemsList = q.items || q.line_items || q.items_list || q.products || [];
                (Array.isArray(itemsList) ? itemsList : []).forEach(it => {
                    // normalise item fields: {item_name, quantity, rate, description}
                    const item = {
                        item_name: it.item_name ?? it.name ?? it.title ?? it.product_name ?? it.description ?? '',
                        quantity: it.quantity ?? it.qty ?? it.count ?? 1,
                        rate: it.rate ?? it.unit_price ?? it.price ?? it.amount ?? 0,
                        description: it.description ?? it.desc ?? ''
                    };
                    addItemRowWithData(item);
                });

                // tax
                const taxEl = document.getElementById('tax-percentage');
                if (taxEl && (q.tax_percentage !== undefined || q.tax_rate !== undefined || q.taxPercent !== undefined)) {
                    taxEl.value = q.tax_percentage ?? q.tax_rate ?? q.taxPercent ?? 0;
                    // trigger totals update if function exists
                    if (typeof updateTotals === 'function') updateTotals();
                }

                // terms/notes/signature
                const terms = q.terms || q.terms_and_conditions || q.terms_conditions;
                if (terms && document.getElementById('terms-input')) document.getElementById('terms-input').value = terms;

                const notes = q.notes || q.note || q.remark;
                if (notes && document.getElementById('notes-input')) document.getElementById('notes-input').value = notes;

                if (q.signature && document.getElementById('signature-input')) document.getElementById('signature-input').value = q.signature;

                // attachments (if any) - just list filenames if preview exists
                if (q.attachments && Array.isArray(q.attachments) && document.getElementById('preview-attachments-list')) {
                    const list = document.getElementById('preview-attachments-list');
                    list.innerHTML = '';
                    q.attachments.forEach(a => {
                        const li = document.createElement('li');
                        li.textContent = (typeof a === 'string') ? a : (a.filename || a.name || JSON.stringify(a));
                        list.appendChild(li);
                    });
                    // show preview block
                    const block = document.getElementById('preview-attachments-block');
                    if (block) block.classList.remove('hidden-section');
                }

                // finally update totals UI
                if (typeof updateTotals === 'function') updateTotals();
                else {
                    // fallback: call the code that sets sub_total/tax/total if it exists in page
                    const subtotalEl = document.getElementById('sub_total');
                    const taxElText = document.getElementById('tax');
                    const totalEl = document.getElementById('total');
                    if (subtotalEl && totalEl) {
                        // calculate manually
                        let subtotal = 0;
                        document.querySelectorAll('.item-row').forEach(r => {
                            const qty = parseFloat(r.querySelector('.quantity')?.value || 0);
                            const rate = parseFloat(r.querySelector('.rate')?.value || 0);
                            subtotal += qty * rate;
                        });
                        const tp = parseFloat(document.getElementById('tax-percentage')?.value || 0);
                        const taxVal = subtotal * (tp / 100);
                        subtotalEl.textContent = `₹${subtotal.toFixed(2)}`;
                        if (taxElText) taxElText.textContent = `₹${taxVal.toFixed(2)}`;
                        totalEl.textContent = `₹${(subtotal + taxVal).toFixed(2)}`;
                    }
                }

                // optional: show alert to user
                const alertContainer = document.getElementById('alert-container');
                if (alertContainer) {
                    alertContainer.innerHTML = '<div class="alert alert-success">Loaded quotation data into Sales Order form.</div>';
                    setTimeout(() => { if (alertContainer) alertContainer.innerHTML = ''; }, 3500);
                }
            } catch (err) {
                console.warn('Populate-from-quotation failed:', err);
                const alertContainer = document.getElementById('alert-container');
                if (alertContainer) alertContainer.innerHTML = `<div class="alert alert-error">Could not load quotation: ${err.message}</div>`;
            }
        })();
    </script>

<script>
(async function populateFromSalesOrderIfRequested() {
  // helper: get query param
  function getQueryParam(name) {
    try {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    } catch (e) { return null; }
  }

  // try multiple endpoints to fetch sales order by id
  async function fetchSalesOrderById(sid) {
    const attempts = [
      `/api/sales_orders/${encodeURIComponent(sid)}`,
      `/api/sales_order/${encodeURIComponent(sid)}`,
      `/api/salesorders/${encodeURIComponent(sid)}`,
      `http://Aixains-Mac-mini.local:8000/api/sales_orders/${encodeURIComponent(sid)}`,
      `http://localhost:5000/api/sales_orders/${encodeURIComponent(sid)}`
    ];
    let lastErr = null;
    for (const u of attempts) {
      try {
        const res = await fetch(u, { method: 'GET' });
        if (!res.ok) { lastErr = new Error(`HTTP ${res.status} from ${u}`); continue; }
        const json = await res.json();
        if (!json) continue;
        // normalize shapes: may return {sales_order: {...}} or array
        if (Array.isArray(json) && json.length) return json[0];
        if (json.sales_order) return json.sales_order;
        return json;
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('Failed to fetch sales order');
  }

  // create or reuse an item row and fill data
  function addItemRowWithData(item) {
    // normalize item fields
    const name = item.item_name ?? item.name ?? item.title ?? item.product_name ?? '';
    const qty  = (item.quantity ?? item.qty ?? item.count ?? item.qtyOrdered ?? 0);
    const rate = (item.rate ?? item.unit_price ?? item.price ?? item.amount ?? 0);
    const desc = item.description ?? item.desc ?? item.note ?? '';

    if (typeof createItemRow === 'function') {
      createItemRow(); // uses page's builder
      const rows = document.querySelectorAll('.item-row');
      const row = rows[rows.length - 1];
      if (!row) return;
      const nameEl = row.querySelector('.item-name');
      const qtyEl = row.querySelector('.quantity');
      const rateEl = row.querySelector('.rate');
      const descEl = row.querySelector('.description');
      if (nameEl) nameEl.value = name;
      if (qtyEl) qtyEl.value = qty;
      if (rateEl) rateEl.value = rate;
      if (descEl) descEl.value = desc;
      if (typeof updateRowAmount === 'function') updateRowAmount(row);
      else {
        const amtEl = row.querySelector('.amount');
        if (amtEl) amtEl.textContent = `₹${(Number(qty)*Number(rate)).toFixed(2)}`;
      }
    } else {
      // fallback builder (simple)
      const itemsContainer = document.getElementById('items-container');
      if (!itemsContainer) return;
      const row = document.createElement('div');
      row.className = 'item-row grid grid-cols-12 gap-2 items-center p-2 border rounded';
      row.innerHTML = `
        <input class="col-span-5 item-name input-field" placeholder="Item name" required>
        <input type="number" class="col-span-2 quantity input-field text-right" value="1" min="0">
        <input type="number" class="col-span-2 rate input-field text-right" value="0" min="0">
        <span class="col-span-3 amount text-right">₹0.00</span>
        <textarea class="description input-field col-span-12" rows="2" placeholder="Item description (optional)"></textarea>
      `;
      itemsContainer.appendChild(row);
      row.querySelector('.item-name').value = name;
      row.querySelector('.quantity').value = qty;
      row.querySelector('.rate').value = rate;
      row.querySelector('.description').value = desc;
      const amt = (Number(qty) * Number(rate));
      row.querySelector('.amount').textContent = `₹${amt.toFixed(2)}`;
    }
  }

  // set client field (supports select or text input)
  function setClientField(clientObjOrName) {
    const billedSelect = document.getElementById('billed-to-select');
    const billedInput = document.getElementById('billed-to-input') || document.getElementById('billed-to');
    const name = (typeof clientObjOrName === 'string') ? clientObjOrName :
                 (clientObjOrName?.client_name || clientObjOrName?.name || clientObjOrName?.company_name || '');
    const id   = (clientObjOrName && (clientObjOrName._id || clientObjOrName.id)) ?? name;

    if (billedSelect) {
      let opt = Array.from(billedSelect.options).find(o => o.value === String(id) || o.text === name);
      if (!opt) {
        opt = document.createElement('option');
        opt.value = id;
        opt.textContent = name || String(id);
        billedSelect.appendChild(opt);
      }
      billedSelect.value = opt.value;
    } else if (billedInput) {
      billedInput.value = name;
    }
    // populate other client detail fields if present
    if (clientObjOrName && typeof clientObjOrName === 'object') {
      if (document.getElementById('client-address') && (clientObjOrName.address || clientObjOrName.street)) {
        document.getElementById('client-address').value = clientObjOrName.address ?? clientObjOrName.street ?? '';
      }
      if (document.getElementById('client-gst') && (clientObjOrName.gst_number || clientObjOrName.gst)) {
        document.getElementById('client-gst').value = clientObjOrName.gst_number ?? clientObjOrName.gst ?? '';
      }
      if (document.getElementById('client-phone') && (clientObjOrName.phone || clientObjOrName.mobile)) {
        document.getElementById('client-phone').value = clientObjOrName.phone ?? clientObjOrName.mobile ?? '';
      }
      if (document.getElementById('client-email') && (clientObjOrName.email)) {
        document.getElementById('client-email').value = clientObjOrName.email;
      }
    }
  }

  // calculate totals (tries page functions; fallback to simple calc)
  function recalcTotals() {
    if (typeof updateTotals === 'function') {
      try { updateTotals(); return; } catch (e) { /* continue */ }
    }
    // fallback simple totals
    const subtotalEl = document.getElementById('sub_total') || document.getElementById('subtotal') || document.getElementById('subtotal-display');
    const taxEl = document.getElementById('tax') || document.getElementById('total-tax') || document.getElementById('tax-display');
    const totalEl = document.getElementById('grand-total') || document.getElementById('total') || document.getElementById('grandtotal-display');
    let subtotal = 0;
    document.querySelectorAll('.item-row').forEach(r => {
      const q = parseFloat(r.querySelector('.quantity')?.value || 0);
      const rt = parseFloat(r.querySelector('.rate')?.value || 0);
      subtotal += (q * rt);
    });
    const tp = parseFloat(document.getElementById('tax-percentage')?.value || 0);
    const taxVal = subtotal * (tp / 100);
    if (subtotalEl) subtotalEl.textContent = `₹${subtotal.toFixed(2)}`;
    if (taxEl) taxEl.textContent = `₹${taxVal.toFixed(2)}`;
    if (totalEl) totalEl.textContent = `₹${(subtotal + taxVal).toFixed(2)}`;
  }

  // main flow
  try {
    // small delay so page init (clients/company) can run first
    await new Promise(r => setTimeout(r, 200));

    const maybeId = getQueryParam('fromSalesOrder') || getQueryParam('soId') || getQueryParam('salesOrderId');
    let salesOrder = null;

    if (maybeId) {
      try {
        salesOrder = await fetchSalesOrderById(maybeId);
      } catch (e) {
        console.warn('fetchSalesOrderById failed:', e);
      }
    }

    // fallback: sessionStorage key commonly used in home_sales_order.html
    if (!salesOrder) {
      const raw = sessionStorage.getItem('salesOrderToConvert') || sessionStorage.getItem('salesOrder');
      if (raw) {
        try { salesOrder = JSON.parse(raw); } catch (e) { salesOrder = null; }
      }
    }

    if (!salesOrder) return; // nothing to populate

    // map invoice number (prefer invoice_no or generate from so number/id)
    const invoiceNoEl = document.getElementById('invoice-no') || document.getElementById('invoice-number');
    const preferredNo = salesOrder.invoice_no ?? salesOrder.invoiceNo ?? salesOrder.so_number ?? salesOrder.soNo ?? salesOrder.number ?? salesOrder._id;
    if (invoiceNoEl && preferredNo) invoiceNoEl.value = preferredNo;

    // invoice & due dates
    const safeDateISO = d => { if (!d) return ''; const dt = new Date(d); return isNaN(dt) ? '' : dt.toISOString().slice(0,10); };
    const invDateEl = document.getElementById('invoice-date') || document.getElementById('date');
    const dueDateEl = document.getElementById('due-date') || document.getElementById('payment-due');
    const invDate = safeDateISO(salesOrder.invoice_date ?? salesOrder.date ?? salesOrder.created_at) || (new Date().toISOString().slice(0,10));
    const dueDate = safeDateISO(salesOrder.due_date ?? salesOrder.payment_due_date) || '';
    if (invDateEl) invDateEl.value = invDate;
    if (dueDateEl && dueDate) dueDateEl.value = dueDate;

    // client details
    if (salesOrder.to || salesOrder.client || salesOrder.customer) {
      setClientField(salesOrder.to ?? salesOrder.client ?? salesOrder.customer);
    } else {
      // check direct fields
      const clientName = salesOrder.client_name ?? salesOrder.to_name ?? salesOrder.customer_name;
      if (clientName) setClientField(clientName);
    }

    // company logo if present
    const logoUrl = salesOrder.logo ?? (salesOrder.from && (salesOrder.from.logo)) ?? salesOrder.company_logo;
    if (logoUrl) {
      const logoPreview = document.getElementById('logo-preview') || document.getElementById('businessLogoPreview') || document.getElementById('logo-preview-img');
      if (logoPreview) logoPreview.src = logoUrl;
    }

    // clear existing items
    const itemsContainer = document.getElementById('items-container');
    if (itemsContainer) itemsContainer.innerHTML = '';

    // map items from several possible properties
    const itemsList = salesOrder.items ?? salesOrder.line_items ?? salesOrder.products ?? salesOrder.order_items ?? [];
    (Array.isArray(itemsList) ? itemsList : []).forEach(it => {
      // normalize commonly used keys
      const item = {
        item_name: it.item_name ?? it.name ?? it.title ?? it.product_name ?? '',
        quantity: it.quantity ?? it.qty ?? it.count ?? it.qtyOrdered ?? 0,
        rate: it.rate ?? it.unit_price ?? it.price ?? it.amount ?? 0,
        description: it.description ?? it.desc ?? it.note ?? it.item_description ?? ''
      };
      addItemRowWithData(item);
    });

    // tax mapping
    const taxEl = document.getElementById('tax-percentage') || document.getElementById('taxPercent') || document.getElementById('tax-rate');
    if (taxEl && (salesOrder.tax_percentage !== undefined || salesOrder.tax_percent !== undefined || salesOrder.tax_rate !== undefined)) {
      taxEl.value = salesOrder.tax_percentage ?? salesOrder.tax_percent ?? salesOrder.tax_rate ?? 0;
    } else if (salesOrder.tax && typeof salesOrder.tax === 'number') {
      // some orders store tax amount not percent; keep percent blank and set total if possible
    }

    // notes / terms / signature
    if (salesOrder.terms || salesOrder.terms_and_conditions) {
      const termsEl = document.getElementById('terms-input') || document.getElementById('terms');
      if (termsEl) termsEl.value = salesOrder.terms ?? salesOrder.terms_and_conditions;
    }
    if (salesOrder.notes || salesOrder.note || salesOrder.remark) {
      const notesEl = document.getElementById('notes-input') || document.getElementById('notes');
      if (notesEl) notesEl.value = salesOrder.notes ?? salesOrder.note ?? salesOrder.remark;
    }
    if (salesOrder.signature || (salesOrder.signatory && salesOrder.signatory.signature)) {
      const sigEl = document.getElementById('signature-input') || document.getElementById('signatory') || document.getElementById('signature');
      if (sigEl) sigEl.value = salesOrder.signature ?? (salesOrder.signatory && salesOrder.signatory.signature) ?? '';
    }

    // bank details
    if (salesOrder.bank_details || salesOrder.bank) {
      const bd = salesOrder.bank_details ?? salesOrder.bank;
      const bankDisplay = document.getElementById('bank-details-display') || document.getElementById('bank-info');
      if (bankDisplay) {
        bankDisplay.innerHTML = `
          ${bd.bankName ? `<div><strong>Bank:</strong> ${bd.bankName}</div>` : ''}
          ${bd.accountNo || bd.account_number ? `<div><strong>A/C:</strong> ${bd.accountNo ?? bd.account_number}</div>` : ''}
          ${bd.ifsc ? `<div><strong>IFSC:</strong> ${bd.ifsc}</div>` : ''}
        `;
      }
    }

    // attempt to set already-calculated subtotal/tax/total if present on salesOrder
    if (typeof salesOrder.subtotal !== 'undefined') {
      const subtotalEl = document.getElementById('sub_total') || document.getElementById('subtotal') || document.getElementById('subtotal-display');
      if (subtotalEl) subtotalEl.textContent = `₹${Number(salesOrder.subtotal).toFixed(2)}`;
    }
    if (typeof salesOrder.tax_amount !== 'undefined') {
      const taxAmountEl = document.getElementById('tax') || document.getElementById('total-tax') || document.getElementById('tax-display');
      if (taxAmountEl) taxAmountEl.textContent = `₹${Number(salesOrder.tax_amount).toFixed(2)}`;
    }
    if (typeof salesOrder.total !== 'undefined') {
      const totalEl = document.getElementById('grand-total') || document.getElementById('total') || document.getElementById('grandtotal-display');
      if (totalEl) totalEl.textContent = `₹${Number(salesOrder.total).toFixed(2)}`;
    }

    // recalc totals using available functions or fallback
    recalcTotals();

    // remove session key to avoid re-population on reload
    try { sessionStorage.removeItem('salesOrderToConvert'); } catch (e) { /* ignore */ }

    // show a small success alert if alert container exists
    const alertContainer = document.getElementById('alert-container');
    if (alertContainer) {
      alertContainer.innerHTML = '<div class="alert alert-success">Loaded Sales Order into Invoice form.</div>';
      setTimeout(() => { if (alertContainer) alertContainer.innerHTML = ''; }, 3500);
    }
    console.log('SalesOrder -> Invoice populated', salesOrder);
  } catch (err) {
    console.warn('Populate-from-sales-order failed:', err);
    const alertContainer = document.getElementById('alert-container');
    if (alertContainer) alertContainer.innerHTML = `<div class="alert alert-error">Could not load sales order: ${err.message}</div>`;
  }
})();
</script>

                }

                tableBody.innerHTML = `<tr><td colspan="5" class="table-body-cell text-center">Loading transactions...</td></tr>`;

                // Here are the three API endpoints being called
                const urls = [
                    'http://Aixains-Mac-mini.local:8000/api/invoices',
                    'http://Aixains-Mac-mini.local:8000/api/sales-orders',
                    'http://Aixains-Mac-mini.local:8000/api/quotations'
                ];

                try {
                    // This line fetches data from all URLs at the same time
                    const responses = await Promise.all(urls.map(url => fetch(url)));

                    for (const response of responses) {
                        if (!response.ok) throw new Error(`Failed to fetch from ${response.url}`);
                    }

                    // This line gets the JSON data from all the successful responses
                    const [invoices, salesOrders, quotations] = await Promise.all(responses.map(res => res.json()));

                    const clientInvoices = invoices.filter(doc => doc.client_id === clientId);
                    const clientSalesOrders = salesOrders.filter(doc => doc.client_id === clientId);
                    const clientQuotations = quotations.filter(doc => doc.client_id === clientId);

                    let transactions = [];

                    clientInvoices.forEach(inv => transactions.push({ doc_type: 'Invoice', date: inv.invoice_date, doc_no: inv.invoice_no, amount: inv.total, type: 'debit' }));
                    clientSalesOrders.forEach(so => transactions.push({ doc_type: 'Sales Order', date: so.sales_order_date, doc_no: so.sales_order_no, amount: so.total, type: 'debit' }));
                    clientQuotations.forEach(q => transactions.push({ doc_type: 'Quotation', date: q.quotation_date, doc_no: q.quotation_no, amount: q.total, type: 'info' }));

                    transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

                    allTransactions = transactions;
                    renderTransactions(allTransactions);

                } catch (error) {
                    console.error('Failed to fetch client data:', error);
                    let errorMessage = "Error loading client statements.";
                    if (error instanceof TypeError && error.message.toLowerCase().includes('failed to fetch')) {
                        errorMessage = "Could not connect to the API server. Please ensure your backend is running and CORS is enabled.";
                    }
                    tableBody.innerHTML = `<tr><td colspan="5" class="table-body-cell text-center text-red-500">${errorMessage}</td></tr>`;
                    statementCount.textContent = 'Error';
                }
            }

            function renderTransactions(transactions) {
                tableBody.innerHTML = '';
                if (transactions.length === 0) {
                    statementCount.textContent = 'Showing 0 of 0 Statements';
                    tableBody.innerHTML = `<tr><td colspan="5" class="table-body-cell text-center">No transactions found for this client.</td></tr>`;
                    totalBalanceEl.textContent = '₹0.00';
                    return;
                }

                statementCount.textContent = `Showing 1 to ${transactions.length} of ${transactions.length} Statements`;
                let runningTotal = 0;

                transactions.forEach(item => {
                    const row = document.createElement('tr');

                    if (item.type === 'debit') {
                        runningTotal += item.amount;
                    } else if (item.type === 'credit') {
                        runningTotal -= item.amount;
                    }

                    if (item.type === 'info') {
                        row.style.color = '#6b7280';
                    }

                    row.innerHTML = `
                <td class="table-body-cell">${new Date(item.date).toLocaleDateString()}</td>
                <td class="table-body-cell">${item.doc_type}</td>
                <td class="table-body-cell text-right">#${item.doc_no}</td>
                <td class="table-body-cell text-right">₹${item.amount.toLocaleString()}</td>
                <td class="table-body-cell text-right font-semibold">₹${runningTotal.toLocaleString()}</td>
            `;
                    tableBody.appendChild(row);
                });

                totalBalanceEl.textContent = `₹${runningTotal.toLocaleString()} (Due)`;
            }

            fetchClientData();

            document.getElementById('service-filter').addEventListener('change', (event) => {
                const selectedType = event.target.value;
                if (selectedType === 'all') {
                    renderTransactions(allTransactions);
                } else {
                    const filteredTransactions = allTransactions.filter(t => t.doc_type === selectedType);
                    renderTransactions(filteredTransactions);
                }
            });

            const dropdownBtn = document.getElementById('documents-dropdown-btn');
            const dropdownContent = document.getElementById('documents-dropdown-content');
            const dropdownIcon = document.getElementById('dropdown-icon');

            dropdownBtn.addEventListener('click', () => {
                dropdownContent.classList.toggle('hidden');
                dropdownIcon.classList.toggle('rotate-180');

        // Add other countries as needed
      ];

      // --- HELPER FUNCTIONS (populate dropdowns, etc.) ---
      function renderPhoneCountryList(countries) {
        countryCodeList.innerHTML = "";
        countries.forEach((country) => {
          const item = document.createElement("a");
          item.href = "#";
          item.className = "px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center";
          item.dataset.code = country.dial_code;
          item.dataset.countryCode = country.code;
          // use a proper template string here
          item.innerHTML = `<span class="font-medium flex-1">${country.name}</span><span class="text-gray-500 ml-auto">${country.dial_code}</span>`;
          countryCodeList.appendChild(item);
        });

      function populateCountryDropdowns() {
        // clear first
        countrySelect.innerHTML = '<option value="">Select Country</option>';
        allCountries.forEach((country) => {
          const option = document.createElement("option");
          option.value = country.code;
          option.textContent = country.name;
          countrySelect.appendChild(option);
        });
        renderPhoneCountryList(allCountries);
      }

      function selectCountry(countryCode) {
        const country = allCountries.find(c => c.code === countryCode);
        if (country) {
          selectedCode.textContent = country.dial_code;
          countrySelect.value = country.code;
        }
      }

      // --- NEW FUNCTION TO SET DEFAULT COUNTRY ---
      async function setDefaultCountry() {
        try {
          // Fetches the user's location based on their IP address
          // NOTE: some environments may block this for CORS — fallback to IN if it fails
          const response = await fetch('https://ipapi.co/json/');
          if (!response.ok) {
            throw new Error('Failed to fetch location data.');
          }
          const data = await response.json();
          const userCountryCode = data && data.country ? data.country : null; // e.g., "US", "IN"

          // Check if the detected country exists in your 'allCountries' list
          const countryExists = allCountries.some(c => c.code === userCountryCode);

          if (userCountryCode && countryExists) {
            // If it exists, select it
            selectCountry(userCountryCode);
          } else {
            // Otherwise, fall back to India
            selectCountry("IN");

        submitBtn.innerHTML = "Saving...";

        try {

          if (!userId) {

          // =================================================
          // === FIX: GET THE TOKEN FROM LOCAL STORAGE ===
          // =================================================

          if (!token) {
            alert("Authentication error. Please log in again.");
            window.location.href = "../index.html"; // Redirect to login page
            return;
          }

          // 2. Gather form data
          const formData = new FormData(businessForm);
          const rawData = Object.fromEntries(formData.entries());
          const selectedCountry = allCountries.find(c => c.code === rawData.country);
          const countryName = selectedCountry ? selectedCountry.name : "";

          // safe dial code fallback
          const dial = (selectedCode.textContent || "+91").trim();
          const phoneValue = (rawData.phone || "").trim();
          const fullPhone = dial + (phoneValue.startsWith(dial) ? phoneValue.replace(dial, '') : phoneValue);

          // 3. Construct the final data payload
          const data = {

            team_size: parseInt(rawData.teamSize) || 1,

            email: rawData.email,

            },
            currency: rawData.currency,

          };

          console.error('Submission Error:', error);

    });
