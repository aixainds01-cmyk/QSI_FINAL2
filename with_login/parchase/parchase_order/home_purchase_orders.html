    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const API_BASE_URL = 'http://Aixains-Mac-mini.local:8000/api';
            const API_URL = `${API_BASE_URL}/purchase-orders`;

            // --- GLOBAL VARIABLE FOR SAFETY ---
            let CURRENT_PO_ID = null;

            // Elements
            const tbody = document.getElementById('po-table-body');
            const totalCountSpan = document.getElementById('total-count');
            const filterStatus = document.getElementById('filter-status');
            const filterVendor = document.getElementById('filter-vendor');
            const filterDate = document.getElementById('filter-date');
            const tabActive = document.getElementById('tab-active');
            const tabDeleted = document.getElementById('tab-deleted');
            const selectAllCheckbox = document.getElementById('select-all-checkbox');

            // NEW: Search & Clear Elements
            const filterSearch = document.getElementById('filter-search');
            const clearFiltersBtn = document.getElementById('clear-filters-btn');

            // Bulk Action Elements
            const bulkActionBar = document.getElementById('bulk-action-bar');
            const bulkActionCount = document.getElementById('bulk-action-count');
            const bulkActionClose = document.getElementById('bulk-action-close');
            const bulkActionsActive = document.getElementById('bulk-actions-active');
            const bulkActionsDeleted = document.getElementById('bulk-actions-deleted');

            // Payment Modal Elements
            const paymentModal = document.getElementById('payment-modal');
            const paymentForm = document.getElementById('payment-form');
            const payPoNo = document.getElementById('pay-po-no');
            const payVendor = document.getElementById('pay-vendor');
            const payTotal = document.getElementById('pay-total');
            const payAlreadyPaid = document.getElementById('pay-already-paid');
            const payPending = document.getElementById('pay-pending');
            const payAmountInput = document.getElementById('pay-amount-input');
            const payDateInput = document.getElementById('pay-date-input');

            let currentTab = 'active';
            let allPurchaseOrders = [];
            let displayedPurchaseOrders = [];

            function getAuthHeaders() {
                const token = localStorage.getItem("token");
                return token ? { 'Authorization': `Bearer ${token}` } : null;
            }

            async function safeFetch(url, opts = {}) {
                const headers = Object.assign({}, opts.headers || {});
                const authHeaders = getAuthHeaders();
                if (authHeaders) Object.assign(headers, authHeaders);
                if (opts.body && !(opts.body instanceof FormData) && !headers["Content-Type"]) {
                    headers["Content-Type"] = "application/json";
                }
                try {
                    const res = await fetch(url, Object.assign({}, opts, { headers }));
                    if (!res.ok) {
                        const errorData = await res.json().catch(() => ({}));
                        throw new Error(errorData.message || res.statusText);
                    }
                    const text = await res.text();
                    return text ? JSON.parse(text) : {};
                } catch (error) {
                    console.error("API Error:", error);
                    throw error;
                }
            }

            const formatCurrency = val => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(Number(val) || 0);

            // ✅ SUPER CLEAN ID FUNCTION
            function getCleanId(doc) {
                if (!doc) return null;
                // Check various possible ID locations
                let id = doc._id || doc.id || doc.original_id;

                // If it's an object like {$oid: "..."}
                if (typeof id === 'object' && id !== null) {
                    if (id.$oid) return id.$oid;
                    return id.toString();
                }
                return id;
            }

            function statusBadge(status) {
                const s = (status || 'draft').toLowerCase();
                if (s.includes('receiv') || s === 'paid') return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Received / Paid</span>`;
                if (s.includes('partial')) return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">Partially Paid</span>`;
                if (s.includes('approv')) return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-800">Approved</span>`;
                if (s.includes('pend')) return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">Pending</span>`;
                if (s.includes('cancel') || s.includes('delete')) return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">Cancelled</span>`;
                return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">Draft</span>`;
            }

            async function fetchOrders() {
                try {
                    const data = await safeFetch(API_URL);
                    allPurchaseOrders = Array.isArray(data) ? data : [];
                    populateVendorFilter();
                    applyFilters();
                } catch (err) {
                    if (tbody) tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500">Error: ${err.message}</td></tr>`;
                }
            }

            function populateVendorFilter() {
                if (!filterVendor) return;
                const vendors = new Set(allPurchaseOrders.map(po => po.vendor_name || 'Unknown'));
                filterVendor.innerHTML = '<option>All Vendors</option>';
                Array.from(vendors).sort().forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v;
                    opt.textContent = v;
                    filterVendor.appendChild(opt);
                });
            }

            // NEW UPDATED APPLY FILTERS FUNCTION
            function applyFilters() {
                // 1. Filter by Tab (Active vs Deleted) first
                let filtered = allPurchaseOrders.filter(po => {
                    const status = (po.status || '').toLowerCase();
                    const isDeleted = status.includes('cancel') || status.includes('delete');
                    return currentTab === 'active' ? !isDeleted : isDeleted;
                });

                // Get values from inputs
                const sSearch = filterSearch ? filterSearch.value.trim().toLowerCase() : '';
                const sVendor = filterVendor ? filterVendor.value : 'All Vendors';
                const sStatus = filterStatus ? filterStatus.value : 'All';
                const sDate = filterDate ? filterDate.value : '';

                // 2. Filter by Inputs
                filtered = filtered.filter(po => {

                    // Search Filter (PO Number)
                    const matchSearch = !sSearch || (po.po_no || '').toLowerCase().includes(sSearch);
                    
                    // Vendor Filter
                    const matchVendor = sVendor === 'All Vendors' || (po.supplier_name || '') === sVendor;
                    
                    // Status Filter
=======
                    const matchVendor = sVendor === 'All Vendors' || (po.vendor_name || '') === sVendor;
>>>>>>> 90d5df3ed6464a9be9e0a477693ee24e69a98caa
                    const matchStatus = sStatus === 'All' || (po.status || '').toLowerCase().includes(sStatus.toLowerCase());
                    
                    // Date Filter
                    const matchDate = !sDate || (po.po_date && po.po_date.startsWith(sDate));

                    return matchSearch && matchVendor && matchStatus && matchDate;
                });

                displayedPurchaseOrders = filtered;
                renderTable();
            }

            function renderTable() {
                if (totalCountSpan) totalCountSpan.textContent = displayedPurchaseOrders.length;
                if (!tbody) return;
                tbody.innerHTML = '';

                if (displayedPurchaseOrders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-gray-500">No orders found.</td></tr>`;
                    return;
                }

                displayedPurchaseOrders.forEach(po => {
                    // ✅ CLEAN ID Extraction
                    const id = getCleanId(po);

                    if (!id) {
                        console.error("❌ Missing ID for PO:", po);
                        return;
                    }

                    const totalAmt = po.total || 0;
                    const paidAmt = po.paid_amount || 0;
                    const pendingAmt = Math.max(0, totalAmt - paidAmt);

                    let payButton = '';
                    if (currentTab === 'active') {
                        if (pendingAmt > 1) {
                            // ✅ ID is set directly here
                            payButton = `
                            <button class="action-payment text-gray-400 hover:text-green-600 font-bold text-sm flex items-center gap-1 transition-colors" 
                                    title="Pay Vendor"
                                    data-id="${id}" 
                                    data-po-no="${po.po_no}"
                                    data-vendor="${po.vendor_name}"
                                    data-total="${totalAmt}"
                                    data-paid="${paidAmt}">
                                <i class="fas fa-money-bill-wave"></i> Pay
                            </button>`;
                        } else {
                            payButton = `<span class="text-xs text-green-600 font-bold flex items-center gap-1"><i class="fas fa-check-circle"></i> Paid</span>`;
                        }
                    }

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 border-b transition-colors';
                    tr.innerHTML = `
                    <td class="table-body-cell text-center"><input type="checkbox" class="po-checkbox w-4 h-4 rounded text-indigo-600" data-id="${id}"></td>
                    <td class="table-body-cell font-medium text-gray-800">${po.po_no}</td>
                    <td class="table-body-cell text-gray-500 text-sm">${po.po_date || '-'}</td>
                    <td class="table-body-cell font-medium text-gray-700">${po.vendor_name || 'N/A'}</td>
                    <td class="table-body-cell">${statusBadge(po.status)}</td>
                    <td class="table-body-cell text-right text-green-600 font-medium">${formatCurrency(paidAmt)}</td>
                    <td class="table-body-cell text-right font-bold text-gray-800">${formatCurrency(totalAmt)}</td>
                    <td class="table-body-cell">
                        <div class="flex items-center justify-center space-x-3">
                            <button class="text-gray-400 hover:text-indigo-600 action-open" data-id="${id}"><i class="fas fa-external-link-alt"></i></button>
                            <button class="text-gray-400 hover:text-indigo-600 action-edit" data-id="${id}"><i class="fas fa-pencil-alt"></i></button>
                            ${payButton}
                            <button class="text-gray-400 hover:text-red-600 action-cancel" title="Cancel Order" data-id="${id}"><i class="fas fa-ban"></i></button>
                        </div>
                    </td>
                `;
                    tbody.appendChild(tr);
                });

                attachEventHandlers();
            }

            function attachEventHandlers() {
                tbody.querySelectorAll('.po-checkbox').forEach(cb => cb.addEventListener('change', updateSelectionUI));
                tbody.querySelectorAll('.action-open').forEach(btn => btn.addEventListener('click', () => window.location.href = `view_purchase_order.html?id=${btn.dataset.id}`));
                tbody.querySelectorAll('.action-edit').forEach(btn => btn.addEventListener('click', () => window.location.href = `edit_purchase_order.html?id=${btn.dataset.id}`));

                tbody.querySelectorAll('.action-cancel').forEach(btn => btn.addEventListener('click', async () => {
                    if (!confirm("Cancel this order?")) return;
                    try {
                        await safeFetch(`${API_URL}/${btn.dataset.id}/status`, {
                            method: 'PUT',
                            body: JSON.stringify({ status: 'Cancelled' })
                        });
                        fetchOrders();
                    } catch (e) { alert(e.message); }
                }));

                // ✅ Robust Pay Button Handler
                tbody.querySelectorAll('.action-payment').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const d = e.currentTarget.dataset;
                        const rawId = d.id;

                        // 🔍 DIAGNOSTIC CHECK
                        if (!rawId || rawId === "undefined" || rawId === "null") {
                            alert("Error: ID not found on button. Please refresh page.");
                            console.error("Bad ID on button:", d);
                            return;
                        }

                        openPaymentModal({
                            id: rawId, // Pass clean string ID
                            po_no: d.poNo,
                            vendor: d.vendor,
                            total: parseFloat(d.total),
                            paid: parseFloat(d.paid)
                        });
                    });
                });
            }

            function openPaymentModal(data) {
                if (!paymentModal) return;

                // ✅ SAVE ID TO GLOBAL VARIABLE (Safest method)
                CURRENT_PO_ID = data.id;
                console.log("✅ Payment Modal Opened for ID:", CURRENT_PO_ID);

                if (payPoNo) payPoNo.textContent = data.po_no;
                if (payVendor) payVendor.textContent = data.vendor || 'Unknown';

                const pending = data.total - data.paid;

                if (payTotal) payTotal.textContent = formatCurrency(data.total);
                if (payAlreadyPaid) payAlreadyPaid.textContent = formatCurrency(data.paid);
                if (payPending) payPending.textContent = formatCurrency(pending);

                if (payAmountInput) {
                    payAmountInput.value = pending.toFixed(2);
                    payAmountInput.max = pending.toFixed(2);
                }
                if (payDateInput) payDateInput.value = new Date().toISOString().split('T')[0];

                paymentModal.classList.remove('hidden');
                paymentModal.classList.add('flex');
            }

            function closePaymentModal() {
                if (!paymentModal) return;
                paymentModal.classList.add('hidden');
                paymentModal.classList.remove('flex');
                CURRENT_PO_ID = null; // Clear ID
                if (paymentForm) paymentForm.reset();
            }

            if (paymentForm) {
                paymentForm.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    // ✅ USE GLOBAL ID VARIABLE
                    if (!CURRENT_PO_ID) {
                        alert("System Error: No Purchase Order Selected. Please close and try again.");
                        return;
                    }

                    const btn = document.getElementById('save-payment-btn');
                    const originalText = btn.innerHTML;
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

                    const payload = {
                        purchase_order_id: CURRENT_PO_ID, // Using Global Var
                        amount: parseFloat(payAmountInput.value),
                        payment_date: payDateInput.value,
                        payment_method: document.getElementById('pay-method-input').value,
                        notes: document.getElementById('pay-notes-input').value
                    };

                    try {
                        await safeFetch(`${API_BASE_URL}/vendor-payments`, {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        });

                        alert('Payment recorded successfully!');
                        closePaymentModal();
                        fetchOrders();
                    } catch (err) {
                        alert('Failed: ' + err.message);
                    } finally {
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                    }
                });
            }

            const closeBtn = document.getElementById('close-payment-modal');
            if (closeBtn) closeBtn.addEventListener('click', closePaymentModal);
            const cancelBtn = document.getElementById('cancel-payment-btn');
            if (cancelBtn) cancelBtn.addEventListener('click', closePaymentModal);

            // Sidebar & UI Logic
            const sidebar = document.getElementById('sidebar');
            const mobileBtn = document.getElementById('mobile-menu-btn');
            if (mobileBtn) mobileBtn.addEventListener('click', () => sidebar.classList.remove('hidden'));

            if (tabActive) tabActive.addEventListener('click', () => { currentTab = 'active'; updateTabUI(); applyFilters(); });
            if (tabDeleted) tabDeleted.addEventListener('click', () => { currentTab = 'deleted'; updateTabUI(); applyFilters(); });

            function updateTabUI() {
                if (currentTab === 'active') {
                    tabActive.classList.replace('text-gray-600', 'text-indigo-700'); tabActive.classList.replace('hover:bg-gray-100', 'bg-indigo-100');
                    tabDeleted.classList.replace('text-indigo-700', 'text-gray-600'); tabDeleted.classList.replace('bg-indigo-100', 'hover:bg-gray-100');
                } else {
                    tabDeleted.classList.replace('text-gray-600', 'text-indigo-700'); tabDeleted.classList.replace('hover:bg-gray-100', 'bg-indigo-100');
                    tabActive.classList.replace('text-indigo-700', 'text-gray-600'); tabActive.classList.replace('bg-indigo-100', 'hover:bg-gray-100');
                }
            }

            if (selectAllCheckbox) selectAllCheckbox.addEventListener('change', e => {
                tbody.querySelectorAll('.po-checkbox').forEach(cb => cb.checked = e.target.checked);
                updateSelectionUI();
            });

            function updateSelectionUI() {
                if (!bulkActionBar) return;
                const count = tbody.querySelectorAll('.po-checkbox:checked').length;
                if (count > 0) {
                    bulkActionBar.classList.remove('hidden');
                    if (bulkActionCount) bulkActionCount.textContent = count;
                    if (currentTab === 'active') {
                        if (bulkActionsActive) bulkActionsActive.classList.remove('hidden');
                        if (bulkActionsDeleted) bulkActionsDeleted.classList.add('hidden');
                    } else {
                        if (bulkActionsActive) bulkActionsActive.classList.add('hidden');
                        if (bulkActionsDeleted) bulkActionsDeleted.classList.remove('hidden');
                    }
                } else {
                    bulkActionBar.classList.add('hidden');
                }
            }

            const closeBulk = document.getElementById('bulk-action-close');
            if (closeBulk) closeBulk.addEventListener('click', () => {
                if (selectAllCheckbox) selectAllCheckbox.checked = false;
                tbody.querySelectorAll('.po-checkbox').forEach(cb => cb.checked = false);
                updateSelectionUI();
            });

            const setupDropdown = (btnId, contentId, iconId) => {
                const btn = document.getElementById(btnId);
                const content = document.getElementById(contentId);
                const icon = document.getElementById(iconId);
                if (btn) btn.addEventListener('click', () => { content.classList.toggle('hidden'); icon.classList.toggle('rotate-180'); });
            };
            setupDropdown('documents-dropdown-btn', 'documents-dropdown-content', 'dropdown-icon');
            setupDropdown('purchases-dropdown-btn', 'purchases-dropdown-content', 'purchases-dropdown-icon');

            if (filterStatus) filterStatus.addEventListener('change', applyFilters);
            if (filterVendor) filterVendor.addEventListener('change', applyFilters);
            if (filterDate) filterDate.addEventListener('change', applyFilters);

            // NEW: SEARCH & RESET EVENT LISTENERS
            if (filterSearch) filterSearch.addEventListener('input', applyFilters);
            if (clearFiltersBtn) {
                clearFiltersBtn.addEventListener('click', () => {
                    if (filterSearch) filterSearch.value = '';
                    if (filterStatus) filterStatus.value = 'All';
                    if (filterVendor) filterVendor.value = 'All Vendors';
                    if (filterDate) filterDate.value = '';
                    applyFilters(); // Refresh table
                });
            }

            fetchOrders();
        });
    </script>
</body>

</html>
