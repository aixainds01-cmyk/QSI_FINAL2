    <script>
    document.addEventListener('DOMContentLoaded', function () {
        // --- AUTHENTICATION CHECK ---
        const API_BASE_URL = 'http://Aixains-Mac-mini.local:8000/api';
        const API_URL = `${API_BASE_URL}/purchase-orders`;

        function checkAuthentication() {
            const token = localStorage.getItem("token");
            if (!token) {
                alert("⚠️ Authentication token is missing! Please log in.");
                window.location.href = '/login.html';
                return false;
            }
            return true;
        }

        // Check auth before proceeding
        if (!checkAuthentication()) {
            return;
        }

        function getAuthHeaders() {
            const token = localStorage.getItem("token");
            if (token) {
                return {'Authorization': `Bearer ${token}`};
            }
            return null;
        }

        async function safeFetch(url, opts = {}) {
            const headers = Object.assign({}, opts.headers || {});
            const authHeaders = getAuthHeaders();

            if (!authHeaders) {
                alert("Authentication token not found. Please log in.");
                window.location.href = '/login.html';
                throw new Error("Authentication token not found.");
            }
            Object.assign(headers, authHeaders);

            if (opts.body && !(opts.body instanceof FormData) && !headers["Content-Type"]) {
                headers["Content-Type"] = "application/json";
            }

            const finalOpts = Object.assign({}, opts, { headers });

            try {
                const res = await fetch(url, finalOpts);
                const text = await res.text();
                let data;
                try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }

                if (!res.ok) {
                    if (res.status === 401) {
                        alert("Session expired or invalid. Please log in again.");
                        localStorage.removeItem('token');
                        localStorage.removeItem('userId');
                        window.location.href = '/login.html';
                        throw new Error("Session expired");
                    }
                    const errMsg = (data && data.message) || (typeof data === "string" ? data : res.statusText) || "Request failed";
                    const error = new Error(errMsg);
                    error.status = res.status;
                    error.data = data;
                    throw error;
                }

                return data;
            } catch (err) {
                if (err.message !== 'Authentication token not found' && err.message !== 'Session expired') {
                    throw err;
                }
                throw new Error("Authentication required");
            }
        }

        // --- Sidebar dropdown logic ---
        const dropdownBtn = document.getElementById('documents-dropdown-btn');
        const dropdownContent = document.getElementById('documents-dropdown-content');
        const dropdownIcon = document.getElementById('dropdown-icon');
        dropdownBtn.addEventListener('click', () => {
            dropdownContent.classList.toggle('hidden');
            dropdownIcon.classList.toggle('rotate-180');
        });
        document.getElementById('purchases-dropdown-btn').addEventListener('click', () => {
            document.getElementById('purchases-dropdown-content').classList.toggle('hidden');
            document.getElementById('purchases-dropdown-icon').classList.toggle('rotate-180');
        });

        // --- Elements ---
        const tbody = document.getElementById('po-table-body');
        const selectAllCheckbox = document.getElementById('select-all-checkbox');
        const filterVendor = document.getElementById('filter-vendor');
        const filterStatus = document.getElementById('filter-status');

        // --- Utility functions ---
        function getId(po) { return po._id || po.id || 'unknown'; }
        function getPoNo(po) { return po.po_no || po.purchase_order_no || 'N/A'; }
        function getVendor(po) { return po.supplier_name || po.vendor_name || (po.supplier && po.supplier.vendor_name) || 'Unknown Vendor'; }
        function getStatus(po) { return po.status || 'Draft'; }
        function getSubTotal(po) { return po.sub_total ?? po.subtotal ?? po.subTotal ?? 0; }
        function getAmount(po) { return po.total ?? po.amount ?? po.grand_total ?? 0; }
        function getOrderDate(po) { return po.po_date || po.order_date || 'N/A'; }
        
        function formatCurrency(value) {
            const num = Number(value) || 0;
            try {
                return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(num);
            } catch (e) { return '₹' + num.toFixed(2); }
        }
        
        function statusBadge(status) {
            const s = (status || '').toLowerCase();
            if (s.includes('approved')) {
                return '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Approved</span>';
            }
            if (s.includes('pending')) {
                return '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">Pending</span>';
            }
            if (s.includes('received')) {
                return '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">Received</span>';
            }
            if (s.includes('cancelled') || s.includes('cancel')) {
                return '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Cancelled</span>';
            }
            if (s.includes('draft')) {
                return '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">Draft</span>';
            }
            return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">${escapeHtml(status || '—')}</span>`;
        }
        
        function escapeHtml(str) {
            return String(str).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
        }
        
        function showLoading() { 
            tbody.innerHTML = `<tr><td class="table-body-cell text-center" colspan="7">Loading purchase orders...</td></tr>`; 
        }
        
        function showError(msg) { 
            tbody.innerHTML = `<tr><td class="table-body-cell text-center text-red-600" colspan="7">Error: ${escapeHtml(msg)}</td></tr>`; 
        }

        // --- Render list and wire up actions ---
        let allPurchaseOrders = [];

        function renderList(list) {
            allPurchaseOrders = list || [];
            
            if (!list || list.length === 0) {
                tbody.innerHTML = `<tr><td class="table-body-cell text-center" colspan="7">No purchase orders found. <a href="create_purchase_order.html" class="text-indigo-600 hover:underline">Create one now</a>.</td></tr>`;
                return;
            }
            
            let html = '';
            list.forEach((po, idx) => {
                const id = escapeHtml(getId(po));
                const poNo = escapeHtml(getPoNo(po));
                const vendor = escapeHtml(getVendor(po));
                const status = escapeHtml(getStatus(po));
                const subtotal = formatCurrency(getSubTotal(po));
                const amount = formatCurrency(getAmount(po));
                const orderDate = escapeHtml(getOrderDate(po));
                
                html += `
                    <tr data-status="${status.toLowerCase()}" data-vendor="${vendor}">
                        <td class="table-body-cell text-center">
                            <input type="checkbox" class="po-checkbox" data-id="${id}">
                        </td>
                        <td class="table-body-cell">
                            <div class="font-semibold">${poNo}</div>
                            <div class="text-xs text-gray-500">Date: ${orderDate}</div>
                        </td>
                        <td class="table-body-cell">${vendor}</td>
                        <td class="table-body-cell">${statusBadge(status)}</td>
                        <td class="table-body-cell">${subtotal}</td>
                        <td class="table-body-cell font-semibold">${amount}</td>
                        <td class="table-body-cell">
                            <div class="flex items-center space-x-3 text-gray-500">
                                <button class="hover:text-indigo-600 action-open" title="Open" data-id="${id}">
                                    <i class="fas fa-external-link-alt"></i>
                                </button>
                                <button class="hover:text-indigo-600 action-edit" title="Edit" data-id="${id}">
                                    <i class="fas fa-pencil-alt"></i>
                                </button>
                                <button class="hover:text-indigo-600 action-email" title="Email Vendor" data-id="${id}">
                                    <i class="fas fa-envelope"></i>
                                </button>
                                <button class="hover:text-indigo-600 action-dup" title="Duplicate" data-id="${id}">
                                    <i class="fas fa-copy"></i>
                                </button>
                                <button class="hover:text-indigo-600 action-more" title="More" data-id="${id}">
                                    <i class="fas fa-ellipsis-h"></i>
                                </button>
                            </div>
                        </td>
                    </tr>`;
            });
            tbody.innerHTML = html;
            wireUpActions();
            populateVendorFilter(list);
        }

        function wireUpActions() {
            document.querySelectorAll('.action-open').forEach(btn => btn.addEventListener('click', e => {
                window.location.href = `view_purchase_order.html?id=${encodeURIComponent(e.currentTarget.dataset.id)}`;
            }));
            
            document.querySelectorAll('.action-edit').forEach(btn => btn.addEventListener('click', e => {
                window.location.href = `edit_purchase_order.html?id=${encodeURIComponent(e.currentTarget.dataset.id)}`;
            }));
            
            document.querySelectorAll('.action-email').forEach(btn => btn.addEventListener('click', e => {
                alert('Email vendor for PO ' + e.currentTarget.dataset.id);
            }));
            
            document.querySelectorAll('.action-dup').forEach(btn => btn.addEventListener('click', e => {
                alert('Duplicate action for ' + e.currentTarget.dataset.id);
            }));
            
            document.querySelectorAll('.action-more').forEach(btn => btn.addEventListener('click', e => {
                e.stopPropagation();
                openMorePopover(e.currentTarget);
            }));
        }
function statusBadge(status) {
    const s = (status || '').toLowerCase();
    
    const badges = {
        'approved': '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800"><i class="fas fa-check-circle mr-1"></i>Approved</span>',
        'pending': '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800"><i class="fas fa-clock mr-1"></i>Pending</span>',
        'received': '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800"><i class="fas fa-box mr-1"></i>Received</span>',
        'cancelled': '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800"><i class="fas fa-times-circle mr-1"></i>Cancelled</span>',
        'draft': '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800"><i class="fas fa-file mr-1"></i>Draft</span>'
    };
    
    for (const [key, badge] of Object.entries(badges)) {
        if (s.includes(key)) return badge;
    }
    
    return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">${escapeHtml(status || '—')}</span>`;
}
        function openMorePopover(buttonEl) {
    closeAllPopovers();
    const id = buttonEl.dataset.id;
    const menu = document.createElement('div');
    menu.className = 'popover-menu';
    menu.style.position = 'absolute';
    menu.style.flexDirection = 'column';
    menu.innerHTML = `
        <button class="popover-item approve" data-id="${encodeURIComponent(id)}">
            <i class="fas fa-check"></i><span>Approve Order</span>
        </button>
        <button class="popover-item receive" data-id="${encodeURIComponent(id)}">
            <i class="fas fa-box"></i><span>Mark as Received</span>
        </button>
        <button class="popover-item cancel-po" data-id="${encodeURIComponent(id)}">
            <i class="fas fa-ban"></i><span>Cancel Order</span>
        </button>
        <div style="height: 1px; background-color: #e5e7eb; margin: 4px 0;"></div>
        <button class="popover-item delete" data-id="${encodeURIComponent(id)}">
            <i class="far fa-trash-alt"></i><span>Delete Order</span>
        </button>`;
    document.body.appendChild(menu);

    const rect = buttonEl.getBoundingClientRect();
    requestAnimationFrame(() => {
        const menuW = menu.offsetWidth, menuH = menu.offsetHeight;
        let left = rect.right + window.scrollX - menuW;
        let top = rect.top + window.scrollY - menuH - 10;
        if (top < window.scrollY + 8) { top = rect.bottom + window.scrollY + 8; }
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
    });

    // Approve handler
    menu.querySelector('.approve').addEventListener('click', async (ev) => {
        const poid = decodeURIComponent(ev.currentTarget.dataset.id);
        if (!confirm('Approve this purchase order?')) return;
        
        try {
            await safeFetch(`${API_URL}/${poid}/status`, {
                method: 'PUT',
                body: JSON.stringify({ status: 'Approved' })
            });
            alert('✅ Purchase order approved successfully.');
            closeAllPopovers();
            fetchPurchaseOrders();
        } catch (err) {
            console.error('Approve failed', err);
            alert('❌ ' + (err.message || 'Failed to approve purchase order'));
        }
    });

    // Receive handler
    menu.querySelector('.receive').addEventListener('click', async (ev) => {
        const poid = decodeURIComponent(ev.currentTarget.dataset.id);
        if (!confirm('Mark this purchase order as received?')) return;
        
        try {
            await safeFetch(`${API_URL}/${poid}/status`, {
                method: 'PUT',
                body: JSON.stringify({ status: 'Received' })
            });
            alert('✅ Purchase order marked as received.');
            closeAllPopovers();
            fetchPurchaseOrders();
        } catch (err) {
            console.error('Receive failed', err);
            alert('❌ ' + (err.message || 'Failed to mark as received'));
        }
    });

    // Cancel handler
    menu.querySelector('.cancel-po').addEventListener('click', async (ev) => {
        const poid = decodeURIComponent(ev.currentTarget.dataset.id);
        const reason = prompt('Reason for cancellation (optional):');
        if (reason === null) return; // User clicked cancel
        
        try {
            await safeFetch(`${API_URL}/${poid}/status`, {
                method: 'PUT',
                body: JSON.stringify({ status: 'Cancelled', reason: reason })
            });
            alert('✅ Purchase order cancelled.');
            closeAllPopovers();
            fetchPurchaseOrders();
        } catch (err) {
            console.error('Cancel failed', err);
            alert('❌ ' + (err.message || 'Failed to cancel purchase order'));
        }
    });

    // Delete handler (same as before)
    menu.querySelector('.delete').addEventListener('click', async (ev) => {
        const poid = decodeURIComponent(ev.currentTarget.dataset.id);
        if (!confirm('Delete this purchase order? This cannot be undone.')) return;

        try {
            await safeFetch(`${API_URL}/${poid}`, { method: 'DELETE' });
            alert('✅ Purchase order deleted successfully.');
            closeAllPopovers();
            fetchPurchaseOrders();
        } catch (err) {
            console.error('Delete failed', err);
            alert('❌ ' + (err.message || 'Failed to delete'));
        }
    });
    
    setTimeout(() => document.addEventListener('click', closeAllPopovers, { once: true }), 0);
}
        
        function closeAllPopovers() {
            document.querySelectorAll('.popover-menu').forEach(m => m.remove());
        }

        // --- Filter Logic ---
        function populateVendorFilter(list) {
            const names = new Set(list.map(getVendor));
            filterVendor.innerHTML = '<option>All Vendors</option>';
            Array.from(names).sort().forEach(name => {
                const opt = document.createElement('option');
                opt.value = name; 
                opt.textContent = name;
                filterVendor.appendChild(opt);
            });
        }

        function applyFilters() {
            const selectedVendor = filterVendor.value;
            const selectedStatus = filterStatus.value;

            document.querySelectorAll('#po-table-body tr').forEach(tr => {
                const vendor = tr.dataset.vendor || '';
                const status = tr.dataset.status || '';

                const matchesVendor = selectedVendor === 'All Vendors' || vendor.includes(selectedVendor);
                const matchesStatus = selectedStatus === 'All' || status.includes(selectedStatus.toLowerCase());

                tr.style.display = (matchesVendor && matchesStatus) ? '' : 'none';
            });
        }
        
        selectAllCheckbox.addEventListener('change', () => {
            document.querySelectorAll('.po-checkbox').forEach(cb => cb.checked = selectAllCheckbox.checked);
        });
        
        filterVendor.addEventListener('change', applyFilters);
        filterStatus.addEventListener('change', applyFilters);

        // --- Initial Fetch ---
        async function fetchPurchaseOrders() {
            showLoading();
            try {
                const list = await safeFetch(API_URL);
                console.log('Fetched purchase orders:', list);
                renderList(Array.isArray(list) ? list : []);
            } catch (err) {
                console.error('Fetch error:', err);
                showError(err.message || 'Could not load purchase orders.');
            }
        }

        fetchPurchaseOrders();
    });
    </script>
</body>
</html>
